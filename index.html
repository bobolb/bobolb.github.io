<html>
<head>
<title>GDRI map | JPAC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css" />
<link rel="stylesheet" href="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css"/>
<style>
.risk-popup,
.risk-popup * {
	pointer-events: none;
}
.maplibregl-popup-content {
	background-color: #ffffff;
	padding-top: 0px;
	padding-bottom: 0px;
	padding-right: 15px;
	padding-left: 15px;
	border-radius: 5px;
	box-shadow: 0 0 10px rgba(0,0,0,0.5);
}
.maplibregl-popup-anchor-top .maplibregl-popup-tip {
	border-bottom-color: #ffffff;
}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
	border-top-color: #ffffff;
}
.maplibregl-popup-anchor-left .maplibregl-popup-tip {
	border-right-color: #ffffff;
}
.maplibregl-popup-anchor-right .maplibregl-popup-tip {
	border-left-color: #ffffff;
}
.maplibregl-ctrl-geocoder {
	width: min(500px, 80vw);
}
.maplibregl-ctrl-geocoder:has(input:not(:placeholder-shown))
.maplibregl-ctrl-geocoder--button {
	display: block !important;
}
.maplibregl-ctrl-attrib.maplibregl-compact {
	display: flex !important;
	align-items: flex-end !important;
}
.maplibregl-ctrl-attrib-button {
	align-self: flex-end !important;
}
.maplibregl-ctrl-attrib.maplibregl-compact
.maplibregl-ctrl-attrib-button {
	top: auto !important;
	bottom: 0 !important;
}
</style>
</head>
<body>
<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.min.js"></script>
<div id="zoom-display" style="position: absolute; bottom: 10px; left: 10px; background: white; padding: 5px 10px; font-family: sans-serif; z-index: 1;">Zoom: <span id="zoom-level"></span></div>
<div id="map" style="width: 100%; height: 100%"></div>
<script>var useRetina = window.devicePixelRatio > 1;</script>
<script type="module">

const DEBUG = true;

// import maplibre
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs';

// pmtiles
const protocol = new pmtiles.Protocol({

	errorOnMissingTile: true

});

maplibregl.addProtocol("pmtiles", (params, controller) => {

	//if (DEBUG) console.log("PMTiles request:", params.url.split(".io/")[1]);
	if (DEBUG) console.log("PMTiles request:", params.url);

	return protocol.tile(params, controller);
});

// create map
const map = new maplibregl.Map({
	container: 'map',
	style: 'style.json',
	center: [2, 46],
	zoom: 4.5,
	minZoom: 3,
	maxZoom: 16,
	attributionControl: {compact: true, customAttribution: "Data from <a href='https://gadm.org/'>GADM</a>"},
	hash: true,
	pitchWithRotate: false
});

// disable map touch pitch control
map.touchPitch.disable();

// display Zoom, get initial level and update on move/zoom 
const zoomDisplay = document.getElementById('zoom-level');
zoomDisplay.textContent = map.getZoom().toFixed(1);
map.on('zoom', () => {zoomDisplay.textContent = map.getZoom().toFixed(1);});

// add navigation controls
map.addControl(new maplibregl.NavigationControl({
	visualizePitch: true,
	visualizeRoll: true,
	showZoom: true,
	showCompass: true
	}),
	'top-right'
);

// query to geocoder
const geocoderApi = {
	forwardGeocode: async (config) => {

		const features = [];

		try {
			const request =
			`https://nominatim.openstreetmap.org/search?q=${config.query}` +
			`&format=geojson` +
			`&addressdetails=1` +
			`&limit=5`;

			if (DEBUG) console.log("Geocoder request:", request);

			const response = await fetch(request);

			if (DEBUG) console.log("Geocoder response:", response);

			const geojson = await response.json();

			for (const feature of geojson.features) {

				if (DEBUG) console.log("Result feature:", feature);

				if (
				!['country',
				'region',
				'state',
				'county',
				'city',
				'town',
				'village']
				.includes(feature.properties.addresstype)
				) {
					continue;
				}

				let center;

				if (feature.geometry.type === "Point") {
					center = feature.geometry.coordinates;
				} else {
					center = [
						(feature.bbox[0] + feature.bbox[2]) / 2,
						(feature.bbox[1] + feature.bbox[3]) / 2
					];
				}

				const point = {
					type: 'Feature',
					geometry: {
					type: 'Point',
					coordinates: center
				},
				bbox: feature.bbox,
				text: feature.properties.name,
				place_name_long: feature.properties.display_name,
				place_name_short: feature.properties.name,
				place_type: feature.properties.addresstype,
				properties: feature.properties,
				center
				};

				features.push(point);
			}
		} catch (e) {
			console.error(`Failed to forwardGeocode with error: ${e}`);
		}
		return {
			features
		};
	}
};

// geocoder format search results list
const geocoder = new MaplibreGeocoder(geocoderApi, {
	maplibregl,
	render: function(item) {
		const type = item.place_type;
		const typeFormatted = type.charAt(0).toUpperCase() + type.slice(1);
		return `
			<div>
				<strong>
					${item.place_name_long}
				</strong>
				<br />
				<small>
					${typeFormatted}
				</small>
			</div>
			`;
	},
	marker: {
		offset: [0, -35]
	},
	showResultMarkers: false,
	flyTo: false,
	showResultsWhileTyping: true,
	minLength: 3,
	limit: 5,
	debounceSearch: 500
});

// add geocoder search bar
map.addControl(geocoder, 'top-left');

// geocoder move view to selected result
geocoder.on('result', (e) => {
	document.activeElement?.blur();
	const result = e.result;
	
	if (DEBUG) console.log("Result selected:", e.result);
	
	if (
		[
			'country',
			'region',
			'state',
			'county',
			'city',
			'town',
			'village'
		]
		.includes(result.properties?.addresstype) &&
		result.bbox
	) {
		map.fitBounds(
			[
				[result.bbox[0], result.bbox[1]],
				[result.bbox[2], result.bbox[3]]
			],
			{ padding: 50 }
		);
	} else {
		map.flyTo({
			center: result.center,
			zoom: 10
		});
	}
});

// create popup but don't add to map yet
map.on('load', async () => {
	const popup = new maplibregl.Popup({
		className: 'risk-popup',
		closeButton: false,
		closeOnClick: false,		
		offset: {
			top: [0, 30],
			bottom: [0, -6],
			left: [8, 0],
			right: [-8, 0],
			'top-left': [7, 7],
			'top-right': [-7, 7],
			'bottom-left': [7, -7],
			'bottom-right': [-7, -7]
		},
	});

	// set layers to watch for popup
//	const hoverLayers = ['risk-WNV-fill', 'risk-MBV-fill', 'ADM_1_fill', 'ADM_2_fill'];

	// detect marker change for overlapping markers, use mousemove not mouseenter event	
	let currentFeature = null;
	
	function getFeatureName(feature) {
		return (
			feature.properties.NAME_2 ||
			feature.properties.NAME_1 ||
			feature.properties.COUNTRY ||
			""
		);
	}

	function showPopup(feature, pointerLngLat) {
				
		const coordinates = feature.geometry.coordinates;

		if (DEBUG) console.log("Lat:", pointerLngLat.lat.toFixed(4));
		if (DEBUG) console.log("Lng:", pointerLngLat.lng.toFixed(4));

		const name = getFeatureName(feature);

		const country = feature.properties.COUNTRY || "";
		const type =
			feature.properties.ENGTYPE_2 ||
			feature.properties.ENGTYPE_1 || "";
		let riskHTML = "";
		if (feature.properties.riskW) {
			riskHTML += '<p style="color:red">West Nile Virus</p>';
		}
		const mbvRisks = [];
		if (feature.properties.riskC) {
			mbvRisks.push('Chikungunya Virus');
		}
		if (feature.properties.riskD) {
			mbvRisks.push('Dengue Virus');
		}
		if (feature.properties.riskY) {
			mbvRisks.push('Yellow Fever Virus');
		}
		if (feature.properties.riskZ) {
			mbvRisks.push('Zika Virus');
		}
		if (mbvRisks.length > 0) {
			riskHTML += `
				<p style="color:#1919e6">
					${mbvRisks.join("<br />")}
				</p>
			`;
		}
		// Deal with copies across the antimeridian
//		while (Math.abs(pointerLngLat.lng - coordinates[0]) > 180) {
//			coordinates[0] +=
//			pointerLngLat.lng > coordinates[0] ? 360 : -360;
//		}

		popup
			.setLngLat(pointerLngLat)
			.setHTML(`
				<p>
					<b><big>${name}</big></b>
					${name !== country ? `
						<br />
						<span style="color:#636363">
							${type} | ${country}
						</span>
					` : ""}
				</p>
				${riskHTML}
			`)
			.addTo(map);
	}

	// Desktop hover - ADM_0
	map.on('mousemove', 'GADM', (e) => {

		const feature = e.features[0];
		const featureId = getFeatureName(feature);

		map.getCanvas().style.cursor = 'pointer';

		// New feature: rebuild popup if feature changed
		if (featureId !== currentFeature) {
			currentFeature = featureId;

			if (DEBUG) console.log("Popup:", currentFeature);
			
			showPopup(feature, e.lngLat);
		}

		// Always follow mouse
		popup.setLngLat(e.lngLat);

	});

	// Desktop hover - ADM_1_2
	map.on('mousemove', ['ADM_1_fill', 'ADM_2_fill'], (e) => {

		const feature = e.features[0];
		const featureId = getFeatureName(feature);

		map.getCanvas().style.cursor = 'pointer';

		// Don't rebuild popup while moving within same feature
		if (featureId === currentFeature) {
			return;
		}

		currentFeature = featureId;

		if (DEBUG) console.log("Popup:", currentFeature);
		
		showPopup(feature, e.lngLat);

	});

	// Tap/click always shows popup, even if it is the same feature - ADM_1
	map.on('click', 'GADM', (e) => {

		const feature = e.features[0];

		currentFeature = getFeatureName(feature);

		if (DEBUG) console.log("Clicked popup for:", currentFeature);

		showPopup(feature, e.lngLat);

	});

	// Remove when leaving watched layers - ADM_0_1_2
	map.on('mouseleave', ['GADM'], () => {

		if (DEBUG) console.log("Leaving:", currentFeature);

		currentFeature = null;

		map.getCanvas().style.cursor = '';

		popup.remove();

	});

	// Remove if popup anchor moves outside map
	map.on('move', () => {

		const popupLngLat = popup.getLngLat();

		if (!popupLngLat) return;

		if (!map.getBounds().contains(popupLngLat)) {

			popup.remove();

			// Important: allow same feature to be selected again
			currentFeature = null;

		}

	});

	map.on("idle", () => {
		for (const layer of ["ADM_0", "ADM_1", "ADM_2"]) {
		const features = map.querySourceFeatures("ADM", {
			sourceLayer: layer
		});
		if (DEBUG) console.log(layer, features.length);
		}
	});

});
</script>
</body>
</html>
