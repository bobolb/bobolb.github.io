<html>
<head>
<title>GDRI map | JPAC</title>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css" />
<link rel="stylesheet" href="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css"/>
<style>
.risk-popup,
.risk-popup * {
	pointer-events: none;
}
.maplibregl-popup-content {
	background-color: #ffffff;
	padding-top: 10px;
	padding-bottom: 10px;
	padding-right: 20px;
	padding-left: 20px;
	border-radius: 10px;
	box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}
.maplibregl-popup-anchor-top .maplibregl-popup-tip {
	border-bottom-color: #ffffff;
}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
	border-top-color: #ffffff;
}
.maplibregl-popup-anchor-left .maplibregl-popup-tip {
	border-right-color: #ffffff;
}
.maplibregl-popup-anchor-right .maplibregl-popup-tip {
	border-left-color: #ffffff;
}
.maplibregl-ctrl-geocoder {
	width: min(500px, 80vw);
}
.maplibregl-ctrl-geocoder:has(input:not(:placeholder-shown))
.maplibregl-ctrl-geocoder--button {
	display: block !important;
}
.maplibregl-ctrl-attrib.maplibregl-compact {
	display: inline-flex !important;
	align-items: flex-end !important;
}
</style>
</head>
<body>
<script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.min.js"></script>
<div id="zoom-display" style="position: absolute; bottom: 10px; left: 10px; background: white; padding: 5px 10px; font-family: sans-serif; z-index: 1;">
Zoom: <span id="zoom-level"></span>
</div>
<div id="map" style="width: 100%; height: 100%"></div>
<script>
var useRetina = window.devicePixelRatio > 1;
</script>
<script type="module">

// import maplibre
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs';

// create map
const map = new maplibregl.Map({
	container: 'map',
	style: 'style.json',
	center: [3.206, 44.582],
	zoom: 5,
	attributionControl: {compact: true, customAttribution: "JPAC GDRI"},
	hash: true,
	pitchWithRotate: false
});

// disable map touch pitch control
map.touchPitch.disable();

// display Zoom, get initial level and update on move/zoom 
const zoomDisplay = document.getElementById('zoom-level');
zoomDisplay.textContent = map.getZoom().toFixed(1);
map.on('zoom', () => {zoomDisplay.textContent = map.getZoom().toFixed(1);});

// add navigation controls
map.addControl(new maplibregl.NavigationControl({
	visualizePitch: true,
	visualizeRoll: true,
	showZoom: true,
	showCompass: true
	}),
	'top-right'
);

// query to geocoder
const geocoderApi = {
	forwardGeocode: async (config) => {

		const features = [];

		try {
			const request =
			`https://nominatim.openstreetmap.org/search?q=${config.query}` +
			`&format=geojson` +
			`&addressdetails=1` +
			`&limit=5`;

			//console.log("Geocoder request:", request);

			const response = await fetch(request);

			//console.log("Geocoder response:", response);

			const geojson = await response.json();

			for (const feature of geojson.features) {

				//console.log("Result feature:", feature);

				if (
				!['country',
				'region',
				'state',
				'county',
				'city',
				'town',
				'village']
				.includes(feature.properties.addresstype)
				) {
					continue;
				}

				let center;

				if (feature.geometry.type === "Point") {
					center = feature.geometry.coordinates;
				} else {
					center = [
						(feature.bbox[0] + feature.bbox[2]) / 2,
						(feature.bbox[1] + feature.bbox[3]) / 2
					];
				}

				const point = {
					type: 'Feature',
					geometry: {
					type: 'Point',
					coordinates: center
				},
				bbox: feature.bbox,
				text: feature.properties.name,
				place_name_long: feature.properties.display_name,
				place_name_short: feature.properties.name,
				place_type: feature.properties.addresstype,
				properties: feature.properties,
				center
				};

				features.push(point);
			}
		} catch (e) {
			console.error(`Failed to forwardGeocode with error: ${e}`);
		}
		return {
			features
		};
	}
};

// geocoder format search results list
const geocoder = new MaplibreGeocoder(geocoderApi, {
	maplibregl,
	render: function(item) {
		const type = item.place_type;
		const typeFormatted = type.charAt(0).toUpperCase() + type.slice(1);
		return `
			<div>
				<strong>
					${item.place_name_long}
				</strong>
				<br />
				<small>
					${typeFormatted}
				</small>
			</div>
			`;
	},
	marker: {
		offset: [0, -35]
	},
	showResultMarkers: false,
	flyTo: false,
	showResultsWhileTyping: true,
	minLength: 3,
	limit: 5,
	debounceSearch: 500
});

// add geocoder search bar
map.addControl(geocoder, 'top-left');

// geocoder move view to selected result
geocoder.on('result', (e) => {
	document.activeElement?.blur();
	const result = e.result;
	console.log("Result selected:", e.result);
	if (
		[
			'country',
			'region',
			'state',
			'county',
			'city',
			'town',
			'village'
		]
		.includes(result.properties?.addresstype) &&
		result.bbox
	) {
		map.fitBounds(
			[
				[result.bbox[0], result.bbox[1]],
				[result.bbox[2], result.bbox[3]]
			],
			{ padding: 50 }
		);
	} else {
		map.flyTo({
			center: result.center,
			zoom: 10
		});
	}
});

// create popup but don't add to map yet
map.on('load', async () => {
	const popup = new maplibregl.Popup({
		className: 'risk-popup',
		closeButton: true,
		closeOnClick: false,
		offset: {
			top: [0, 20],
			bottom: [0, -20],
			left: [20, 0],
			right: [-20, 0],
			'top-left': [15, 15],
			'top-right': [-15, 15],
			'bottom-left': [15, -15],
			'bottom-right': [-15, -15]
		}
	});

	// set layers to watch for popup
	const hoverLayers = ['risk-WNV-fill', 'risk-MBV-fill'];

	// detect marker change for overlapping markers, use mousemove not mouseenter event
	//let currentFeatureCoordinates = null;

	let currentFeature = null;

	function showPopup(feature, pointerLngLat) {

		const pointLng = feature.properties.pointLng;
		const pointLat = feature.properties.pointLat;

		const coordinates = [pointLng, pointLat];

		const name = feature.properties.name;
		const country = feature.properties.COUNTRY || "";
		const type = feature.properties.ENGTYPE_2 || "";

		let riskHTML = "";

		if (feature.properties.riskW) {
			riskHTML += '<p style="color:red">West Nile Virus</p>';
		}

		const mbvRisks = [];

		if (feature.properties.riskC) {
			mbvRisks.push('Chikungunya Virus');
		}

		if (feature.properties.riskD) {
			mbvRisks.push('Dengue Virus');
		}

		if (feature.properties.riskY) {
			mbvRisks.push('Yellow Fever Virus');
		}

		if (feature.properties.riskZ) {
			mbvRisks.push('Zika Virus');
		}

		if (mbvRisks.length > 0) {
			riskHTML += `
				<p style="color:#1919e6">
					${mbvRisks.join("<br />")}
				</p>
			`;
		}
		// Deal with copies across the antimeridian
		while (Math.abs(pointerLngLat.lng - coordinates[0]) > 180) {
			coordinates[0] +=
				pointerLngLat.lng > coordinates[0] ? 360 : -360;
		}

		popup
			.setLngLat(coordinates)
			.setHTML(`
				<p>
					<b><big>${name}</big></b><br />
					<span style="color:#636363">
						${type} &vert; ${country}
					</span>
				</p>
				${riskHTML}
			`)
			.addTo(map);
	}
   // Desktop hover
    map.on('mousemove', hoverLayers, (e) => {

        const feature = e.features[0];
        const featureId = feature.properties.name;

        map.getCanvas().style.cursor = 'pointer';

        // Don't rebuild popup while moving within same feature
        if (featureId === currentFeature) {
            return;
        }

        currentFeature = featureId;

        console.log("Creating popup for:", currentFeature);

        showPopup(feature, e.lngLat);
    });


    // Tap/click always shows popup, even if it is the same feature
    map.on('click', hoverLayers, (e) => {

        const feature = e.features[0];

        currentFeature = feature.properties.name;

        console.log("Clicked popup for:", currentFeature);

        showPopup(feature, e.lngLat);
    });


    // Remove when leaving watched layers
    map.on('mouseleave', hoverLayers, () => {

        currentFeature = null;

        map.getCanvas().style.cursor = '';

        popup.remove();
    });


    // Remove if popup anchor moves outside map
    map.on('move', () => {

        const popupLngLat = popup.getLngLat();

        if (!popupLngLat) return;

        if (!map.getBounds().contains(popupLngLat)) {

            popup.remove();

            // Important: allow same feature to be selected again
            currentFeature = null;
        }
    });

});

   // Desktop hover
    map.on('mousemove', hoverLayers, (e) => {

        const feature = e.features[0];
        const featureId = feature.properties.name;

        map.getCanvas().style.cursor = 'pointer';

        // Don't rebuild popup while moving within same feature
        if (featureId === currentFeature) {
            return;
        }

        currentFeature = featureId;

        console.log("Creating popup for:", currentFeature);

        showPopup(feature, e.lngLat);
    });


    // Tap/click always shows popup, even if it is the same feature
    map.on('click', hoverLayers, (e) => {

        const feature = e.features[0];

        currentFeature = feature.properties.name;

        console.log("Clicked popup for:", currentFeature);

        showPopup(feature, e.lngLat);
    });


    // Remove when leaving watched layers
    map.on('mouseleave', hoverLayers, () => {

        currentFeature = null;

        map.getCanvas().style.cursor = '';

        popup.remove();
    });


    // Remove if popup anchor moves outside map
    map.on('move', () => {

        const popupLngLat = popup.getLngLat();

        if (!popupLngLat) return;

        if (!map.getBounds().contains(popupLngLat)) {

            popup.remove();

            // Important: allow same feature to be selected again
            currentFeature = null;
        }
    });

</script>
</body>
</html>
