<html>
<head>
<title>GDRI map | JPAC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css" />
<link rel="stylesheet" href="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.css"/>
<style>
	.maplibregl-popup-content {
		background-color: #ffffff;
		padding-top: 10px;
		padding-bottom: 10px;
		padding-right: 20px;
		padding-left: 20px;
		border-radius: 10px;
		box-shadow: 0 6px 20px rgba(0,0,0,0.25);
	}
	
	.maplibregl-popup-anchor-top .maplibregl-popup-tip {
		border-bottom-color: #ffffff;
	}
	
	.maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
		border-top-color: #ffffff;
	}

	.maplibregl-popup-anchor-left .maplibregl-popup-tip {
		border-right-color: #ffffff;
	}

	.maplibregl-popup-anchor-right .maplibregl-popup-tip {
		border-left-color: #ffffff;
	}

	.maplibregl-ctrl-geocoder {
		width: min(500px, 80vw);
	}

</style>
</head>    
<body>
<script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder@1.5.0/dist/maplibre-gl-geocoder.min.js"></script>
<div id="zoom-display" style="position: absolute; bottom: 10px; left: 10px; background: white; padding: 5px 10px; font-family: sans-serif; z-index: 1;">
  Zoom: <span id="zoom-level"></span>
</div>
<div id="map" style="width: 100%; height: 100%"></div>

<script>
var useRetina = window.devicePixelRatio > 1;
</script>

<script type="module">
	
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs';
	
const map = new maplibregl.Map({
	container: 'map',
       style: 'style.json',
	center: [3.206, 44.582],
	zoom: 5,
	attributionControl: {compact: true, customAttribution: "JPAC GDRI"},
	hash: true,
		pitchWithRotate: false
});

map.touchPitch.disable();

// display Zoom, get initial level and update on move/zoom 
const zoomDisplay = document.getElementById('zoom-level');
zoomDisplay.textContent = map.getZoom().toFixed(1);
map.on('zoom', () => {zoomDisplay.textContent = map.getZoom().toFixed(1);});

// navigation controls
map.addControl(new maplibregl.NavigationControl({
    visualizePitch: true,
    visualizeRoll: true,
    showZoom: true,
    showCompass: true
	}),
	'top-right'
);

const geocoderApi = {
    forwardGeocode: async (config) => {
        const features = [];

        try {
            const request =
            `https://nominatim.openstreetmap.org/search?q=${config.query}` +
			`&format=geojson` +
			//`&polygon_geojson=1` +
			`&addressdetails=1` +
			`&limit=5`;

			console.log("Request:", request);
			
            const response = await fetch(request);
            
			console.log("Response:", response);

			const geojson = await response.json();
			
            for (const feature of geojson.features) {               
				
				console.log("Raw feature:", feature);
				
				if (
				!['country',
				'region',
				'state',
				'municipality',
				'county',
				'city',
				'town',
				'village']
					.includes(feature.properties.addresstype)
				) {
					continue;
				}
				
				let center;

                if (feature.geometry.type === "Point") {
                    center = feature.geometry.coordinates;
                } else {
                    center = [
						(feature.bbox[0] + feature.bbox[2]) / 2,
						(feature.bbox[1] + feature.bbox[3]) / 2
					];
                }
				
                const point = {
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: center
                    },
                    bbox: feature.bbox,
                    place_name: feature.properties.display_name,
                    properties: feature.properties,
                    text: feature.properties.display_name,
                    place_type: ['place'],
                    center
                };
					
                features.push(point);				
            }
        } catch (e) {
            console.error(`Failed to forwardGeocode with error: ${e}`);
        }

        return {
            features
        };
	}
};

const geocoder = new MaplibreGeocoder(geocoderApi, {
	maplibregl,
	marker: false,
	flyTo: false,
	showResultsWhileTyping: true,
	minLength: 2,
	limit: 5,
	debounceSearch: 1000
});

map.addControl(geocoder, 'top-left');

geocoder.on('result', (e) => {    
	const result = e.result;
	console.log("Result selected:", e.result);

    if (
        ['country',
		'region',
		'state',
		'municipality',
		'county','village','city'].includes(result.properties?.addresstype) &&
        result.bbox
    ) {
        map.fitBounds(
            [
                [result.bbox[0], result.bbox[1]],
                [result.bbox[2], result.bbox[3]]
            ],
            { padding: 50 }
        );
    } else {
        map.flyTo({
            center: result.center,
            zoom: 10
        });
    }
});

/*
geocoder.on('result', (e) => {
    console.log('Selected result:', e.result);
	const result = e.result;
    if (
        result.properties?.addresstype === 'country' &&
        result.bbox
    ) {
        map.fitBounds(
            [
                [result.bbox[0], result.bbox[1]],
                [result.bbox[2], result.bbox[3]]
            ],
            {
                padding: 50
            }
        );
    }
});
*/
	map.on('load', async () => {
    // Create a popup, but don't add it to the map yet.
    const popup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false,
								offset: {
								top: [0, 20],
								bottom: [0, -20],
								left: [20, 0],
								right: [-20, 0],
								'top-left': [15, 15],
								'top-right': [-15, 15],
								'bottom-left': [15, -15],
								'bottom-right': [-15, -15]
								}
    });

  // Make sure to detect marker change for overlapping markers
    // and use mousemove instead of mouseenter event
    let currentFeatureCoordinates = undefined;
    map.on('mousemove', 'LabelRisks', (e) => {
	    const featureCoordinates = e.features[0].geometry.coordinates.toString();
        if (currentFeatureCoordinates !== featureCoordinates) {
            currentFeatureCoordinates = featureCoordinates;

            // Change the cursor style as a UI indicator.
            map.getCanvas().style.cursor = 'pointer';

            const coordinates = e.features[0].geometry.coordinates.slice();
            const name = e.features[0].properties.name;
			const country = e.features[0].properties.COUNTRY || "";
			const type = e.features[0].properties.ENGTYPE_2 || "";
			const risks = e.features[0].properties.risks || "";

			let riskHTML = "";
			
			if (risks.toLowerCase().includes("w")) {
				riskHTML += '<p style="color:red">West Nile Virus</p>';
			}
				
			const mbvRisks = [];
			
			if (risks.toLowerCase().includes("c")) {
				mbvRisks.push('Chikungunya Virus');
			}
				
			if (risks.toLowerCase().includes("d")) {
				mbvRisks.push('Dengue Virus');
			}

			if (risks.toLowerCase().includes("y")) {
				mbvRisks.push('Yellow Fever Virus');
			}

			if (risks.toLowerCase().includes("z")) {
				mbvRisks.push('Zika Virus');
			}				
			
			if (mbvRisks.length > 0) {
				riskHTML += `
				<p style="color:#1919e6">
					${mbvRisks.join("<br />")}
					</p>
				`;
			}

            // Ensure that if the map is zoomed out such that multiple
            // copies of the feature are visible, the popup appears
            // over the copy being pointed to.
            while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
            }

            // Populate the popup and set its coordinates
            // based on the feature found.
            popup.setLngLat(coordinates).setHTML(`<p><b><big>${name}</big></b><br /><span style="color:#636363">${type} &vert; ${country}</span></p>${riskHTML}`).addTo(map);
        };
    });

	map.on('mouseleave', 'LabelRisks', () => {
        currentFeatureCoordinates = undefined;
        map.getCanvas().style.cursor = '';
        popup.remove();
    
	});
});
</script>
</body>
</html>
