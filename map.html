<html>
<head>
<title>GDRI map | JPAC</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!--
<script src ="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
-->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.css" />
</head>    
<body>
<div id="map" style="width: 100%; height: 100%"></div>
  <script>
      var useRetina = window.devicePixelRatio > 1;
    </script>
	<script type="module">
	import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.10.0/dist/maplibre-gl.mjs';
	
	const map = new maplibregl.Map({
		container: 'map',
        style: 'https://raw.githubusercontent.com/bobolb/risks/main/jpac_style.json',
		//style: 'https://tiles.openfreemap.org/styles/bright',
		center: [3.206, 44.582],
		zoom: 5,
		attributionControl: {compact: true, customAttribution: "Geographical Disease Risk Index | JPAC"},
		hash: true,
	});

	map.on('load', async () => {
		const image = await map.loadImage('https://maplibre.org/maplibre-gl-js/docs/assets/custom_marker.png');
	
	// Add an image to use as a custom marker
    map.addImage('custom-marker', image.data);

	map.addSource('places', {
        'type': 'geojson',
        'data': {
            'type': 'FeatureCollection',
            'features': [
                {
                    'type': 'Feature',
                    'properties': {
                        'description':
                            '<strong>Vaucluse</strong><ol><li>Chikungunya</li><li>Dengue</li></ol>'
                    },
                    'geometry': {
                        'type': 'Point',
                        'coordinates': [3.203, 44.582]
                    }
                }                
            ]
        }
    });

	// Add a layer showing the places.
    map.addLayer({
        'id': 'places',
        'type': 'symbol',
        'source': 'places',
        'layout': {
            'icon-image': 'custom-marker',
            'icon-overlap': 'always'
        }
    });

    // Create a popup, but don't add it to the map yet.
    const popup = new maplibregl.Popup({
        closeButton: false,
        closeOnClick: false
    });

	});
</script>
</body>
</html>
